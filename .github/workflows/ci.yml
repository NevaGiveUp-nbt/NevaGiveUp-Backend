name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out backend
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Back-end/package-lock.json


      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm exec -- prisma validate

      - name: Generate backend Prisma Client
        run: npm exec -- prisma generate --generator client

      - name: Lint backend source
        id: lint
        continue-on-error: true
        run: npm exec -- eslint 'src/**/*.ts'

      - name: Report existing lint issues
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::Backend ESLint reported issues. See the lint step for details."

      - name: Build backend
        run: npm run build

      - name: Run available Jest unit tests
        run: npm test -- --ci --runInBand --passWithNoTests
